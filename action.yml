name: open-contrib
description: Comment an onboarding roadmap on issues meant for new contributors.
author: AstralunaProject
branding:
  icon: map
  color: purple

inputs:
  github-token:
    description: Token used to read the issue and post the comment. Needs `issues: write`.
    default: ${{ github.token }}
  issue-number:
    description: Issue to analyze. Defaults to the issue from the triggering event.
    default: ''
  labels:
    description: >-
      Comma-separated labels that qualify an issue on `issues` events.
      On `labeled` events the added label itself must be one of them.
      Ignored for manual runs, so any issue can be analyzed on demand.
    default: good first issue,help wanted
  provider:
    description: Force a provider (`anthropic` or `ollama`). Auto-detected from available keys when empty.
    default: ''
  model:
    description: Override the provider's default model.
    default: ''
  anthropic-api-key:
    description: Anthropic API key. Without it the action targets `ollama-base-url`.
    default: ''
  ollama-base-url:
    description: OpenAI-compatible Ollama endpoint reachable from the runner.
    default: http://localhost:11434/v1
  dry-run:
    description: Build the roadmap prompt and print it to the job log without calling any provider or posting.
    default: 'false'

runs:
  using: node24
  main: action/index.js
